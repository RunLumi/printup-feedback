name: Project task status labels

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  sync-status-label:
    if: startsWith(github.event.issue.title, '[')
    runs-on: ubuntu-latest
    steps:
      - name: Parse task and status
        id: parse
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          issue = event["issue"]
          title = issue.get("title") or ""
          body = issue.get("body") or ""

          task = re.match(r"^\[((?:P|V\d+|M\d+)-\d+)\]", title, re.I)
          status = re.search(r"###\s+Trạng thái công việc\s*\n+\s*([^\n]+)", body, re.I)
          if not task or not status:
              raise SystemExit(0)

          value = status.group(1).strip()
          mapping = {
              "To do": "status:todo",
              "Doing": "status:doing",
              "Ready for test": "status:ready-for-test",
              "Bug/Rework": "status:bug-rework",
              "Done": "status:done",
          }
          label = mapping.get(value)
          if not label:
              raise SystemExit(0)

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"task={task.group(1).upper()}\n")
              f.write(f"status={value}\n")
              f.write(f"label={label}\n")
          PY

      - name: Ensure labels exist
        if: steps.parse.outputs.label != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "project-task" --repo "$REPO" --color "344054" --description "Task trong kế hoạch dự án PrintUp" --force
          gh label create "status:todo" --repo "$REPO" --color "98A2B3" --description "Chưa bắt đầu" --force
          gh label create "status:doing" --repo "$REPO" --color "175CD3" --description "Đang thực hiện" --force
          gh label create "status:ready-for-test" --repo "$REPO" --color "F79009" --description "Chờ kiểm tra/phê duyệt" --force
          gh label create "status:bug-rework" --repo "$REPO" --color "D92D20" --description "Không đạt kiểm tra, cần sửa lại" --force
          gh label create "status:done" --repo "$REPO" --color "12B76A" --description "Đã kiểm tra và hoàn tất" --force

      - name: Apply one status label
        if: steps.parse.outputs.label != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          STATUS_LABEL: ${{ steps.parse.outputs.label }}
        run: |
          for label in "status:todo" "status:doing" "status:ready-for-test" "status:bug-rework" "status:done"; do
            gh issue edit "$ISSUE" --repo "$REPO" --remove-label "$label" >/dev/null 2>&1 || true
          done
          gh issue edit "$ISSUE" --repo "$REPO" --add-label "project-task" --add-label "$STATUS_LABEL"
